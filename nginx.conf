# ==============================================================================
#                  VIDEO AUTO TYF - NGINX REVERSE PROXY CONFIG
# ==============================================================================

upstream backend_service {
    server backend:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Cho phép upload video dung lượng lên tới 200MB
    client_max_body_size 200M;
    client_body_buffer_size 128k;

    # Tối ưu thời gian chờ cho các tác vụ cào & xuất bản video dài
    proxy_connect_timeout 90s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Bật nén Gzip để tăng tốc độ truyền tải
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cấu hình WebSocket Realtime (/api/v1/ws)
    location /api/v1/ws {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Cấu hình tất cả các API Endpoints (Để FastAPI tự xử lý CORS, tránh trùng lặp header)
    location / {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint kiểm tra sức khỏe Nginx
    location /nginx_health {
        access_log off;
        return 200 "healthy\n";
    }
}
